<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>固定画像うすめる</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#101827;color:#f3f6ff;margin:0;padding:20px}main{max-width:650px;margin:auto}h1{font-size:23px}p,small{color:#b9c6d9;line-height:1.6}.panel{background:#1b2940;border-radius:17px;padding:17px;margin:14px 0}button,input[type=file]{font:inherit}button{background:#5c8bff;color:white;border:0;border-radius:10px;padding:12px 16px;margin:6px 4px 6px 0}button:disabled{opacity:.4}label{display:block;margin:12px 0}input[type=range]{width:100%}video,canvas{width:100%;border-radius:10px;background:black}#output{display:none}#status{white-space:pre-wrap}a{color:#9bbaff}</style></head><body><main><h1>🎞️ 固定画像うすめる</h1><p>iPhone内で動画を解析する実験ツール。動画はサーバーに送信しません。</p><div class="panel"><label>① 動画を選択（1分以内推奨）<input type="file" id="file" accept="video/*"></label><video id="video" controls playsinline preload="metadata"></video><button id="analyze" disabled>② 固定成分を解析</button><div id="status">動画を選んでください。</div></div><div class="panel"><label>③ 補正の強さ：<span id="sv">40</span>%<input type="range" id="strength" min="0" max="100" value="40"></label><label>固定成分の推定方式<select id="method"><option value="median">時間中央値（標準）</option><option value="mean">時間平均</option></select></label><button id="preview" disabled>静止画プレビュー</button><canvas id="canvas"></canvas><small>注意：固定画像と静止した背景は自動判別できません。色や明るさが不自然になることがあります。元動画の復元を保証するものではありません。</small></div><div class="panel"><button id="export" disabled>④ 補正動画を書き出す</button><p id="exportStatus"></p><video id="output" controls playsinline></video><a id="download" style="display:none" download="corrected.webm">補正動画を保存</a><p><small>Safariの動画書き出し対応状況によっては保存できません。音声は出力されません。対応していない場合はプレビューのスクリーン録画を代替として使えます。</small></p></div></main><script>
const $=id=>document.getElementById(id),v=$('video'),c=$('canvas'),ctx=c.getContext('2d',{willReadFrequently:true});let fileURL=null,base=null,W=0,H=0,samples=[];const sleep=ms=>new Promise(r=>setTimeout(r,ms));
$('strength').oninput=()=>{$('sv').textContent=$('strength').value};$('file').onchange=()=>{const f=$('file').files[0];if(!f)return;if(fileURL)URL.revokeObjectURL(fileURL);fileURL=URL.createObjectURL(f);v.src=fileURL;base=null;$('analyze').disabled=false;$('preview').disabled=true;$('export').disabled=true;$('status').textContent='動画を読み込みました。';};
function seek(t){return new Promise((resolve,reject)=>{const timer=setTimeout(()=>{cleanup();reject(Error('動画の読み取りがタイムアウトしました'))},12000);function cleanup(){clearTimeout(timer);v.removeEventListener('seeked',ok);v.removeEventListener('error',bad)}function ok(){cleanup();resolve()}function bad(){cleanup();reject(Error('動画を読み取れません'))}v.addEventListener('seeked',ok,{once:true});v.addEventListener('error',bad,{once:true});v.currentTime=t;});}
function getFrame(){ctx.drawImage(v,0,0,W,H);return ctx.getImageData(0,0,W,H)}
$('analyze').onclick=async()=>{try{$('analyze').disabled=true;$('status').textContent='解析中…';await new Promise(r=>v.readyState>=1?r():v.addEventListener('loadedmetadata',r,{once:true}));const duration=v.duration;if(!isFinite(duration)||duration<=0)throw Error('動画の長さを取得できません');if(duration>65)throw Error('1分以内の動画で試してください');const scale=Math.min(1,480/v.videoWidth);W=Math.max(2,Math.round(v.videoWidth*scale/2)*2);H=Math.max(2,Math.round(v.videoHeight*scale/2)*2);c.width=W;c.height=H;samples=[];const n=15;for(let i=0;i<n;i++){await seek(Math.min(duration-.05,Math.max(.02,duration*(i+.5)/n)));samples.push(getFrame().data.slice());$('status').textContent=`解析中… ${i+1}/${n}`;await sleep(0)}computeBase();$('preview').disabled=false;$('export').disabled=!(window.MediaRecorder&&c.captureStream);$('status').textContent=`解析完了（${W}×${H}）。プレビューを確認してください。`;await preview()}catch(e){$('status').textContent='エラー: '+e.message}finally{$('analyze').disabled=false}};
function computeBase(){const len=samples[0].length;const arr=new Uint8ClampedArray(len),median=$('method').value==='median';for(let i=0;i<len;i+=4){for(let k=0;k<3;k++){let values=samples.map(s=>s[i+k]);if(median){values.sort((a,b)=>a-b);arr[i+k]=values[Math.floor(values.length/2)]}else arr[i+k]=Math.round(values.reduce((a,b)=>a+b,0)/values.length)}arr[i+3]=255}base=arr}
$('method').onchange=()=>{if(samples.length){computeBase();preview()}};
function corrected(frame){const d=frame.data,s=+$('strength').value/100;for(let i=0;i<d.length;i+=4){for(let k=0;k<3;k++){/* Heuristic: attenuate persistent deviations relative to neutral gray. Not true layer separation. */let offset=(base[i+k]-128)*s*.55;d[i+k]=Math.max(0,Math.min(255,(d[i+k]-offset-128*s*.15)/(1-s*.15)))}}return frame}
async function preview(){if(!base)return;await seek(Math.min(v.duration*.5,v.duration-.05));ctx.putImageData(corrected(getFrame()),0,0)}$('preview').onclick=preview;
$('export').onclick=async()=>{if(!base)return;const status=$('exportStatus');try{$('export').disabled=true;status.textContent='書き出し準備中…';const stream=c.captureStream(20);const mime=['video/mp4','video/webm;codecs=vp9','video/webm'].find(x=>MediaRecorder.isTypeSupported(x));if(!mime)throw Error('このSafariは動画書き出しに非対応です');const rec=new MediaRecorder(stream,{mimeType:mime});const chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};const done=new Promise((resolve,reject)=>{rec.onstop=resolve;rec.onerror=()=>reject(Error('録画エラー'))});await seek(.01);rec.start();await v.play();const start=performance.now();while(!v.ended&&v.currentTime<v.duration-.05){ctx.putImageData(corrected(getFrame()),0,0);status.textContent=`書き出し中 ${Math.round(v.currentTime/v.duration*100)}%`;await sleep(50);if(performance.now()-start>(v.duration+15)*1000)break}v.pause();rec.stop();await done;const blob=new Blob(chunks,{type:mime});const url=URL.createObjectURL(blob),ext=mime.includes('mp4')?'mp4':'webm';$('output').src=url;$('output').style.display='block';$('download').href=url;$('download').download='corrected.'+ext;$('download').style.display='inline';$('download').textContent='補正動画を保存 ('+ext+')';status.textContent='書き出し完了。音声は含まれません。'}catch(e){status.textContent='書き出し不可: '+e.message}finally{$('export').disabled=false}};
</script></body></html>
