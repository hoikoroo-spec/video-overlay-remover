<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>スパイディ補正 v10</title><style>*{box-sizing:border-box}body{background:#101827;color:#f5f7ff;font:16px -apple-system,BlinkMacSystemFont,sans-serif;margin:0;padding:18px}main{max-width:650px;margin:auto}.panel{background:#1b2940;padding:16px;border-radius:16px;margin:14px 0}h1{font-size:23px}p{color:#c6d0e2;line-height:1.55}video,canvas{display:block;width:100%;background:#000;border-radius:10px;margin:10px 0}button{background:#5687fa;color:white;border:0;border-radius:10px;font:inherit;padding:12px;margin:5px 4px 5px 0}button:disabled{opacity:.45}#log{white-space:pre-wrap;font-size:14px}a{color:#b0caff}</style></head><body><main><h1>🎞️ スパイディ補正 v10</h1><p>v9で成功した動画取り込みを使用。固定された半透明画像の部分だけ補正します。動画は送信されません。</p><section class="panel"><p>① 動画を選んで再生し、スパイディが映るところに進めてください。</p><input id="file" type="file" accept="video/*"><video id="video" controls playsinline preload="auto"></video><button id="capture" disabled>② 再生しながら映像を取り込む</button><button id="pauseCapture" disabled>一時停止位置を取り込む</button><p id="status">動画を選択してください。</p></section><section class="panel"><p>③ 下に同じ映像が映るか確認してください。</p><div id="stage" style="position:relative;touch-action:none"><canvas id="canvas"></canvas><canvas id="mask" style="position:absolute;inset:0;width:100%;height:100%;margin:10px 0;touch-action:none;pointer-events:none;background:transparent"></canvas></div><p id="log">診断結果はここに表示されます。</p><label><input id="paint" type="checkbox"> 指でスパイディを塗る</label><p>ブラシ幅 <span id="brushLabel">8</span>% <input id="brush" type="range" min="2" max="25" value="8" style="width:100%"></p><button id="clear">塗り直す</button><p>重ね画像の色 <input id="color" type="color" value="#ffffff"></p><p>推定透明度 <span id="alphaLabel">20</span>% <input id="alpha" type="range" min="0" max="80" value="20" style="width:100%"></p><button id="preview" disabled>④ 補正プレビュー</button><button id="original" disabled>元画像</button><button id="save" disabled>取り込んだ画像を保存</button><button id="export" disabled>⑤ 補正動画を書き出す（無音）</button><p id="exportStatus"></p><video id="output" controls playsinline style="display:none"></video><a id="download" style="display:none">補正動画を保存</a><p>補正は塗った範囲だけに適用します。元の背景が完全に隠れている場合は復元できません。</p></section></main><script>
const $=id=>document.getElementById(id),v=$('video'),c=$('canvas'),ctx=c.getContext('2d',{willReadFrequently:true});let objectURL=null,working=false,original=null,selection=null,painting=false,last=null;const maskCanvas=$('mask'),mctx=maskCanvas.getContext('2d');const sleep=ms=>new Promise(r=>setTimeout(r,ms));
$('file').onchange=()=>{const f=$('file').files[0];if(!f)return;if(objectURL)URL.revokeObjectURL(objectURL);objectURL=URL.createObjectURL(f);v.src=objectURL;v.load();$('capture').disabled=$('pauseCapture').disabled=false;$('save').disabled=true;$('status').textContent='動画を再生し、スパイディが見える位置で②を押してください。'};
async function metadata(){if(v.videoWidth&&v.videoHeight)return;await Promise.race([new Promise(resolve=>v.addEventListener('loadedmetadata',resolve,{once:true})),sleep(10000).then(()=>{throw Error('動画の情報を取得できません')})]);}
function setup(){const scale=Math.min(1,480/v.videoWidth);c.width=Math.max(2,Math.round(v.videoWidth*scale/2)*2);c.height=Math.max(2,Math.round(v.videoHeight*scale/2)*2);maskCanvas.width=c.width;maskCanvas.height=c.height;if(!selection||selection.length!==c.width*c.height)selection=new Uint8Array(c.width*c.height)}
function draw(){ctx.drawImage(v,0,0,c.width,c.height);const a=ctx.getImageData(0,0,c.width,c.height).data;let sum=0,bright=0,n=0;for(let i=0;i<a.length;i+=80){sum+=a[i]+a[i+1]+a[i+2];if(a[i]+a[i+1]+a[i+2]>45)bright++;n++}return{avg:Math.round(sum/n/3),visible:Math.round(bright/n*100)}}
async function capture(mode){if(working)return;working=true;$('capture').disabled=$('pauseCapture').disabled=true;try{await metadata();setup();let wasPaused=v.paused;let stats=[];if(mode==='playing'){await v.play();for(let k=0;k<12;k++){if('requestVideoFrameCallback' in v){await Promise.race([new Promise(resolve=>v.requestVideoFrameCallback(resolve)),sleep(700)])}else await sleep(150);stats.push(draw());if(stats.at(-1).visible>2)break}}else{v.pause();await sleep(250);for(let k=0;k<4;k++){stats.push(draw());if(stats.at(-1).visible>2)break;await sleep(220)}}if(wasPaused||mode==='paused')v.pause();let st=stats.at(-1),ok=st.visible>2;if(ok){original=new Uint8ClampedArray(ctx.getImageData(0,0,c.width,c.height).data);$('preview').disabled=$('original').disabled=false;$('export').disabled=!(window.MediaRecorder&&c.captureStream)}$('log').textContent='取込方式：'+(mode==='playing'?'再生中':'一時停止中')+'\n映像サイズ：'+v.videoWidth+'×'+v.videoHeight+'\nCanvas：'+c.width+'×'+c.height+'\n動画位置：'+v.currentTime.toFixed(2)+'秒\nvideo.readyState：'+v.readyState+'\n取得回数：'+stats.length+'\n平均明るさ：'+st.avg+' / 255\n明るい画素：'+st.visible+'%\n判定：'+(ok?'映像を取得できた可能性があります。上下を目視で確認してください。':'黒画面の疑い。上下の映像を比較してください。');$('status').textContent=ok?'取り込み終了。下の画像が上と同じか確認してください。':'黒画面の可能性があります。もう一方の取り込みボタンも試してください。';$('save').disabled=false}catch(e){$('log').textContent='取込エラー：'+e.message}finally{working=false;$('capture').disabled=$('pauseCapture').disabled=false}}
$('capture').onclick=()=>capture('playing');$('pauseCapture').onclick=()=>capture('paused');
function show(a){ctx.putImageData(new ImageData(new Uint8ClampedArray(a),c.width,c.height),0,0)}
function drawMask(){mctx.clearRect(0,0,maskCanvas.width,maskCanvas.height);if(!$('paint').checked||!selection)return;const img=mctx.createImageData(c.width,c.height);for(let i=0;i<selection.length;i++){if(selection[i]){img.data[i*4]=255;img.data[i*4+1]=40;img.data[i*4+2]=40;img.data[i*4+3]=120}}mctx.putImageData(img,0,0)}
function point(e){const r=maskCanvas.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}
function mark(x,y){const rad=Math.max(2,Math.min(c.width,c.height)*Number($('brush').value)/200);for(let yy=Math.max(0,Math.floor(y-rad));yy<Math.min(c.height,Math.ceil(y+rad));yy++)for(let xx=Math.max(0,Math.floor(x-rad));xx<Math.min(c.width,Math.ceil(x+rad));xx++)if((xx-x)**2+(yy-y)**2<=rad*rad)selection[yy*c.width+xx]=255}
maskCanvas.addEventListener('pointerdown',e=>{if(!$('paint').checked||!original)return;painting=true;maskCanvas.setPointerCapture(e.pointerId);last=point(e);mark(last.x,last.y);drawMask();e.preventDefault()});
maskCanvas.addEventListener('pointermove',e=>{if(!painting)return;const p=point(e),n=Math.max(1,Math.ceil(Math.hypot(p.x-last.x,p.y-last.y)/3));for(let i=1;i<=n;i++)mark(last.x+(p.x-last.x)*i/n,last.y+(p.y-last.y)*i/n);last=p;drawMask();e.preventDefault()});
for(const event of ['pointerup','pointercancel'])maskCanvas.addEventListener(event,()=>painting=false);
$('paint').onchange=()=>{maskCanvas.style.pointerEvents=$('paint').checked?'auto':'none';drawMask()};
$('brush').oninput=()=>$('brushLabel').textContent=$('brush').value;
$('alpha').oninput=()=>$('alphaLabel').textContent=$('alpha').value;
$('clear').onclick=()=>{if(selection)selection.fill(0);drawMask()};
function correct(data){const alpha=Number($('alpha').value)/100,col=$('color').value,overlay=[1,3,5].map(i=>parseInt(col.slice(i,i+2),16)),out=new Uint8ClampedArray(data);if(alpha===0||!selection)return out;for(let p=0;p<selection.length;p++){if(!selection[p])continue;for(let k=0;k<3;k++){const i=p*4+k;out[i]=Math.max(0,Math.min(255,(data[i]-alpha*overlay[k])/(1-alpha)))}}return out}
$('preview').onclick=()=>{if(!original)return;show(correct(original));$('paint').checked=false;$('paint').onchange()};
$('original').onclick=()=>{if(original)show(original)};
$('export').onclick=async()=>{if(working||!original)return;working=true;$('export').disabled=true;let rec;try{const mime=['video/mp4','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));if(!mime)throw Error('Safariの録画機能が利用できません');v.pause();v.currentTime=.1;await sleep(250);let chunks=[],stream=c.captureStream(12);rec=new MediaRecorder(stream,{mimeType:mime});rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};const done=new Promise((resolve,reject)=>{rec.onstop=resolve;rec.onerror=()=>reject(Error('録画に失敗しました'))});rec.start();await v.play();let start=Date.now(),last=-1,count=0;while(!v.ended&&Date.now()-start<Math.max(15000,v.duration*4000)){if(v.currentTime!==last&&v.readyState>=2){const stats=draw(),frame=new Uint8ClampedArray(ctx.getImageData(0,0,c.width,c.height).data);if(stats.visible>2){show(correct(frame));count++}last=v.currentTime;$('exportStatus').textContent='処理中 '+Math.round(v.currentTime/v.duration*100)+'%'}await sleep(70)}v.pause();rec.stop();await done;if(!count)throw Error('映像を取得できませんでした');const blob=new Blob(chunks,{type:mime}),url=URL.createObjectURL(blob);$('output').src=url;$('output').style.display='block';$('download').href=url;$('download').download='corrected-v10.'+(mime.includes('mp4')?'mp4':'webm');$('download').style.display='inline';$('exportStatus').textContent='書き出し完了（無音）。映像を確認してください。'}catch(e){if(rec&&rec.state!=='inactive')rec.stop();$('exportStatus').textContent='エラー：'+e.message}finally{working=false;$('export').disabled=false}};
$('save').onclick=()=>c.toBlob(blob=>{if(!blob)return;const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='frame-diagnostic-v9.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),30000)},'image/png');
</script></body></html>
