<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>動画取込診断 v9</title><style>*{box-sizing:border-box}body{background:#101827;color:#f5f7ff;font:16px -apple-system,BlinkMacSystemFont,sans-serif;margin:0;padding:18px}main{max-width:650px;margin:auto}.panel{background:#1b2940;padding:16px;border-radius:16px;margin:14px 0}h1{font-size:23px}p{color:#c6d0e2;line-height:1.55}video,canvas{display:block;width:100%;background:#000;border-radius:10px;margin:10px 0}button{background:#5687fa;color:white;border:0;border-radius:10px;font:inherit;padding:12px;margin:5px 4px 5px 0}button:disabled{opacity:.45}#log{white-space:pre-wrap;font-size:14px}a{color:#b0caff}</style></head><body><main><h1>🎞️ 動画取込診断 v9</h1><p>今回はスパイディの除去を一時停止し、iPhoneで映像を正しく取り込めるかだけを調べます。動画は送信されません。</p><section class="panel"><p>① 動画を選んで再生し、スパイディが映るところに進めてください。</p><input id="file" type="file" accept="video/*"><video id="video" controls playsinline preload="auto"></video><button id="capture" disabled>② 再生しながら映像を取り込む</button><button id="pauseCapture" disabled>一時停止位置を取り込む</button><p id="status">動画を選択してください。</p></section><section class="panel"><p>③ 下に同じ映像が映るか確認してください。</p><canvas id="canvas"></canvas><p id="log">診断結果はここに表示されます。</p><button id="save" disabled>取り込んだ画像を保存</button><p>上下が一致すれば、次に除去機能を戻します。下が黒い場合は、動画の再生状態・画像デコード・描画を切り分けます。</p></section></main><script>
const $=id=>document.getElementById(id),v=$('video'),c=$('canvas'),ctx=c.getContext('2d',{willReadFrequently:true});let objectURL=null,working=false;const sleep=ms=>new Promise(r=>setTimeout(r,ms));
$('file').onchange=()=>{const f=$('file').files[0];if(!f)return;if(objectURL)URL.revokeObjectURL(objectURL);objectURL=URL.createObjectURL(f);v.src=objectURL;v.load();$('capture').disabled=$('pauseCapture').disabled=false;$('save').disabled=true;$('status').textContent='動画を再生し、スパイディが見える位置で②を押してください。'};
async function metadata(){if(v.videoWidth&&v.videoHeight)return;await Promise.race([new Promise(resolve=>v.addEventListener('loadedmetadata',resolve,{once:true})),sleep(10000).then(()=>{throw Error('動画の情報を取得できません')})]);}
function setup(){const scale=Math.min(1,480/v.videoWidth);c.width=Math.max(2,Math.round(v.videoWidth*scale/2)*2);c.height=Math.max(2,Math.round(v.videoHeight*scale/2)*2)}
function draw(){ctx.drawImage(v,0,0,c.width,c.height);const a=ctx.getImageData(0,0,c.width,c.height).data;let sum=0,bright=0,n=0;for(let i=0;i<a.length;i+=80){sum+=a[i]+a[i+1]+a[i+2];if(a[i]+a[i+1]+a[i+2]>45)bright++;n++}return{avg:Math.round(sum/n/3),visible:Math.round(bright/n*100)}}
async function capture(mode){if(working)return;working=true;$('capture').disabled=$('pauseCapture').disabled=true;try{await metadata();setup();let wasPaused=v.paused;let stats=[];if(mode==='playing'){await v.play();for(let k=0;k<12;k++){if('requestVideoFrameCallback' in v){await Promise.race([new Promise(resolve=>v.requestVideoFrameCallback(resolve)),sleep(700)])}else await sleep(150);stats.push(draw());if(stats.at(-1).visible>2)break}}else{v.pause();await sleep(250);for(let k=0;k<4;k++){stats.push(draw());if(stats.at(-1).visible>2)break;await sleep(220)}}if(wasPaused||mode==='paused')v.pause();let st=stats.at(-1),ok=st.visible>2;$('log').textContent='取込方式：'+(mode==='playing'?'再生中':'一時停止中')+'\n映像サイズ：'+v.videoWidth+'×'+v.videoHeight+'\nCanvas：'+c.width+'×'+c.height+'\n動画位置：'+v.currentTime.toFixed(2)+'秒\nvideo.readyState：'+v.readyState+'\n取得回数：'+stats.length+'\n平均明るさ：'+st.avg+' / 255\n明るい画素：'+st.visible+'%\n判定：'+(ok?'映像を取得できた可能性があります。上下を目視で確認してください。':'黒画面の疑い。上下の映像を比較してください。');$('status').textContent=ok?'取り込み終了。下の画像が上と同じか確認してください。':'黒画面の可能性があります。もう一方の取り込みボタンも試してください。';$('save').disabled=false}catch(e){$('log').textContent='取込エラー：'+e.message}finally{working=false;$('capture').disabled=$('pauseCapture').disabled=false}}
$('capture').onclick=()=>capture('playing');$('pauseCapture').onclick=()=>capture('paused');
$('save').onclick=()=>c.toBlob(blob=>{if(!blob)return;const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='frame-diagnostic-v9.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),30000)},'image/png');
</script></body></html>
