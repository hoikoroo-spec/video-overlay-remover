<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>背景再構成 v12</title><style>*{box-sizing:border-box}body{background:#101827;color:#f4f6ff;font:16px -apple-system,sans-serif;padding:16px;margin:0}main{max-width:650px;margin:auto}.panel{background:#1b2940;border-radius:16px;padding:16px;margin:14px 0}p{color:#c6d0e2;line-height:1.5}button{font:inherit;border:0;border-radius:9px;background:#5687fa;color:white;padding:12px;margin:5px 3px}button:disabled{opacity:.45}video,canvas{display:block;width:100%;border-radius:9px;background:black;margin:10px 0}#stage{position:relative;touch-action:none}#mask{position:absolute;inset:0;background:transparent;touch-action:none;pointer-events:none}input[type=range]{width:100%}#status{white-space:pre-wrap}a{color:#a7c4ff}</style></head><body><main><h2>🎞️ 背景再構成 v12</h2><p>iPhone内で別時刻の背景を探す実験版。動画は送信しません。まず静止画で復元可能か確認します。</p><section class="panel"><input id="file" type="file" accept="video/*"><video id="video" controls playsinline preload="auto"></video><button id="capture" disabled>① 再生しながら現在の画像を取り込む</button><p id="status">動画を選択してください。</p></section><section class="panel"><p>② 「塗る」をONにしてスパイディ全体を塗ってください。輪郭より少し広く塗ると残像を避けられます。</p><label><input id="paint" type="checkbox"> 指で塗る</label><p>ブラシ幅 <span id="brushN">8</span>% <input id="brush" type="range" min="2" max="25" value="8"></p><button id="clear">塗り直す</button><div id="stage"><canvas id="canvas"></canvas><canvas id="mask"></canvas></div><button id="sample" disabled>③ 前後の背景を収集（最大18枚）</button><button id="preview" disabled>④ 背景再構成プレビュー</button><button id="before" disabled>元の画像</button><p id="result">背景を収集すると復元できた割合を表示します。</p></section><section class="panel"><p>背景の動きが少ない動画では復元できないことがあります。黒画面・取得失敗したフレームは使いません。現段階では動画の書き出しは行わず、静止画で精度を確認します。</p><button id="save" disabled>結果の画像を保存</button></section></main><script>
const $=id=>document.getElementById(id),v=$('video'),c=$('canvas'),ctx=c.getContext('2d',{willReadFrequently:true}),mc=$('mask'),mx=mc.getContext('2d'),sleep=t=>new Promise(r=>setTimeout(r,t));let src=null,W=0,H=0,base=null,mask=null,samples=[],busy=false,painting=false,last=null,baseTime=0;
$('file').onchange=()=>{let f=$('file').files[0];if(!f)return;if(src)URL.revokeObjectURL(src);src=URL.createObjectURL(f);v.src=src;v.load();base=null;mask=null;samples=[];$('capture').disabled=false;$('sample').disabled=$('preview').disabled=$('before').disabled=$('save').disabled=true;$('status').textContent='スパイディが見える位置まで再生して①を押してください。'};
async function ready(){if(v.readyState>=2&&v.videoWidth)return;await Promise.race([new Promise(resolve=>v.addEventListener('loadeddata',resolve,{once:true})),sleep(10000).then(()=>{throw Error('動画読み込みタイムアウト')})])}
function grab(){ctx.drawImage(v,0,0,W,H);return new Uint8ClampedArray(ctx.getImageData(0,0,W,H).data)}
function black(a){let n=0,b=0;for(let i=0;i<a.length;i+=80){n++;if(a[i]+a[i+1]+a[i+2]>45)b++}return b/n<.02}
function show(a){ctx.putImageData(new ImageData(new Uint8ClampedArray(a),W,H),0,0)}
async function liveFrame(){await v.play();if(v.requestVideoFrameCallback)await Promise.race([new Promise(resolve=>v.requestVideoFrameCallback(resolve)),sleep(800)]);else await sleep(200);let a=grab();return a}
$('capture').onclick=async()=>{if(busy)return;busy=true;try{await ready();let scale=Math.min(1,320/v.videoWidth);W=Math.max(2,Math.round(v.videoWidth*scale/2)*2);H=Math.max(2,Math.round(v.videoHeight*scale/2)*2);c.width=mc.width=W;c.height=mc.height=H;let a=await liveFrame();v.pause();if(black(a))throw Error('黒い映像でした。別の場面で再試行してください');base=a;baseTime=v.currentTime;mask=new Uint8Array(W*H);samples=[];show(base);drawMask();$('sample').disabled=$('before').disabled=false;$('preview').disabled=true;$('status').textContent='取得成功。スパイディを塗り、③で前後の背景を収集してください。'}catch(e){$('status').textContent='エラー：'+e.message}finally{busy=false}};
function drawMask(){mx.clearRect(0,0,W,H);if(!mask||!$('paint').checked)return;let im=mx.createImageData(W,H);for(let p=0;p<mask.length;p++)if(mask[p]){im.data[p*4]=255;im.data[p*4+1]=40;im.data[p*4+3]=120}mx.putImageData(im,0,0)}
function pos(e){let r=mc.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function mark(x,y){let rad=Math.max(2,Math.min(W,H)*Number($('brush').value)/200);for(let yy=Math.max(0,Math.floor(y-rad));yy<Math.min(H,Math.ceil(y+rad));yy++)for(let xx=Math.max(0,Math.floor(x-rad));xx<Math.min(W,Math.ceil(x+rad));xx++)if((xx-x)**2+(yy-y)**2<=rad**2)mask[yy*W+xx]=1}
mc.addEventListener('pointerdown',e=>{if(!$('paint').checked||!mask)return;painting=true;mc.setPointerCapture(e.pointerId);last=pos(e);mark(last.x,last.y);drawMask();e.preventDefault()});mc.addEventListener('pointermove',e=>{if(!painting)return;let p=pos(e),n=Math.max(1,Math.ceil(Math.hypot(p.x-last.x,p.y-last.y)/3));for(let i=1;i<=n;i++)mark(last.x+(p.x-last.x)*i/n,last.y+(p.y-last.y)*i/n);last=p;drawMask();e.preventDefault()});['pointerup','pointercancel'].forEach(k=>mc.addEventListener(k,()=>painting=false));
$('paint').onchange=()=>{mc.style.pointerEvents=$('paint').checked?'auto':'none';drawMask()};$('brush').oninput=()=>$('brushN').textContent=$('brush').value;$('clear').onclick=()=>{if(mask){mask.fill(0);drawMask();if(base)show(base)}};$('before').onclick=()=>{if(base)show(base)};
async function seek(t){v.pause();let target=Math.min(v.duration-.2,Math.max(.1,t));await new Promise((resolve,reject)=>{let timer=setTimeout(()=>{cleanup();reject(Error('移動タイムアウト'))},5000);function cleanup(){clearTimeout(timer);v.removeEventListener('seeked',ok)}function ok(){cleanup();resolve()}v.addEventListener('seeked',ok);v.currentTime=target});await sleep(100)}
$('sample').onclick=async()=>{if(busy||!base)return;busy=true;$('sample').disabled=true;try{samples=[];let times=[];for(let i=0;i<18;i++){let t=.3+(v.duration-.6)*(i+.5)/18;if(Math.abs(t-baseTime)>.3)times.push(t)}for(let i=0;i<times.length;i++){try{await seek(times[i]);let a=await liveFrame();v.pause();if(!black(a))samples.push({t:times[i],a})}catch(e){}$('status').textContent='収集中 '+(i+1)+'/'+times.length+' / 有効 '+samples.length+'枚';await sleep(0)}show(base);if(samples.length<2)throw Error('有効な参照画像が足りません');$('preview').disabled=false;$('status').textContent='背景 '+samples.length+'枚取得。④を押してください。'}catch(e){$('status').textContent='エラー：'+e.message}finally{busy=false;$('sample').disabled=false}};
function align(a,b){let best={dx:0,dy:0,err:1e9};let bound=Math.min(70,Math.floor(Math.min(W,H)/3));function score(dx,dy){let sum=0,n=0;for(let y=bound;y<H-bound;y+=5)for(let x=bound;x<W-bound;x+=5){let p=y*W+x,q=(y+dy)*W+x+dx;if(mask[p]||mask[q])continue;let i=p*4,j=q*4;sum+=Math.abs(a[i]-b[j])+Math.abs(a[i+1]-b[j+1])+Math.abs(a[i+2]-b[j+2]);n++}return n>25?sum/(n*3):1e9}for(let dy=-bound;dy<=bound;dy+=5)for(let dx=-bound;dx<=bound;dx+=5){let err=score(dx,dy);if(err<best.err)best={dx,dy,err}}let prev=best;for(let dy=Math.max(-bound,prev.dy-5);dy<=Math.min(bound,prev.dy+5);dy++)for(let dx=Math.max(-bound,prev.dx-5);dx<=Math.min(bound,prev.dx+5);dx++){let err=score(dx,dy);if(err<best.err)best={dx,dy,err}}return best}
$('preview').onclick=async()=>{if(busy||!samples.length)return;busy=true;$('preview').disabled=true;$('result').textContent='背景の動きを照合しています…';await sleep(40);try{let acc=new Float32Array(W*H*3),weights=new Float32Array(W*H),used=0;for(let k=0;k<samples.length;k++){let f=samples[k],m=align(base,f.a);if(m.err>32)continue;used++;for(let y=0;y<H;y++)for(let x=0;x<W;x++){let p=y*W+x;if(!mask[p])continue;let xx=x+m.dx,yy=y+m.dy;if(xx<0||xx>=W||yy<0||yy>=H)continue;let q=yy*W+xx;if(mask[q])continue;let w=1/(3+m.err);for(let z=0;z<3;z++)acc[p*3+z]+=f.a[q*4+z]*w;weights[p]+=w}if(k%3===0){$('result').textContent='照合中 '+(k+1)+'/'+samples.length;await sleep(0)}}let out=new Uint8ClampedArray(base),total=0,covered=0;for(let p=0;p<mask.length;p++){if(!mask[p])continue;total++;if(weights[p]){covered++;for(let z=0;z<3;z++)out[p*4+z]=acc[p*3+z]/weights[p]}}show(out);$('paint').checked=false;$('paint').onchange();$('save').disabled=false;$('result').textContent='復元できた範囲：約'+(total?Math.round(covered/total*100):0)+'% / 使えた背景 '+used+'枚。残りは元の映像です。背景が回転・変形する場合は誤補正が起きます。'}catch(e){$('result').textContent='エラー：'+e.message}finally{busy=false;$('preview').disabled=false}};
$('save').onclick=()=>c.toBlob(blob=>{if(!blob)return;let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='background-v12.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),30000)},'image/png');
</script></body></html>
