<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>背景復元テスト v6.3</title><style>
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#101827;color:#f3f6ff;margin:0;padding:18px}main{max-width:650px;margin:auto}h1{font-size:23px}p,small{color:#b9c6d9;line-height:1.6}.panel{background:#1b2940;border-radius:17px;padding:17px;margin:14px 0}button,input[type=file],select{font:inherit}button{background:#5c8bff;color:white;border:0;border-radius:10px;padding:12px 16px;margin:6px 4px 6px 0}button:disabled{opacity:.4}label{display:block;margin:12px 0}input[type=range]{width:100%}video,canvas{width:100%;border-radius:10px;background:black}#paintWrap{position:relative;touch-action:none}#maskCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}#maskCanvas.off{pointer-events:none}#output{display:none}#status,#exportStatus{white-space:pre-wrap}a{color:#9bbaff}.note{font-size:13px}</style></head><body><main><h1>🎞️ 背景復元テスト v6.3</h1><p>固定された重ね画像の背後を、別の時刻に見えている背景から探す実験版。処理はiPhone内で完結し、動画は送信しません。</p>
<div class="panel"><label>① 動画を選択（1分以内推奨）<input type="file" id="file" accept="video/*"></label><video id="video" controls playsinline preload="metadata"></video><button id="analyze" disabled>② 背景フレームを読み込む</button><p id="status">動画を選んでください。</p></div>
<div class="panel"><p>③ スパイディの全体を指で赤く塗る（輪郭より少し広め）</p><label><input type="checkbox" id="maskMode" checked> 指で塗るモード</label><label>ブラシ：<span id="bv">12</span>%<input type="range" id="brush" min="2" max="35" value="12"></label><button id="clearMask">塗り直す</button><label>復元の強さ：<span id="sv">100</span>%<input type="range" id="strength" min="0" max="100" value="100"></label><label>探索する移動幅：<span id="mv">55</span>px<input type="range" id="motion" min="10" max="110" value="55"></label><button id="preview" disabled>④ 復元プレビュー</button><button id="before" disabled>元の画像</button><div id="paintWrap"><canvas id="canvas"></canvas><canvas id="maskCanvas" class="off"></canvas></div><p id="result" class="note">背景が画面内で移動して、隠れていた場所が別の時刻に現れた場合だけ、その部分を復元できます。</p></div>
<div class="panel"><button id="export" disabled>⑤ 補正動画を書き出す（無音）</button><p id="exportStatus"></p><video id="output" controls playsinline></video><a id="download" style="display:none" download="corrected.mp4">動画を保存</a><p class="note">Safariの録画対応状況により書き出せない場合があります。処理が重い場合は短い動画で試してください。動いている人物や物体、回転・ズームには誤補正が生じます。見えていない背景の完全復元はできません。</p></div></main>
<script>
const $=id=>document.getElementById(id),v=$('video'),c=$('canvas'),ctx=c.getContext('2d',{willReadFrequently:true}),mc=$('maskCanvas'),mctx=mc.getContext('2d');let url=null,W=0,H=0,frames=[],mask=null,painting=false,last=null,ready=false,busy=false;const sleep=ms=>new Promise(r=>setTimeout(r,ms));
$('file').onchange=()=>{let f=$('file').files[0];if(!f)return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);v.src=url;frames=[];mask=null;ready=false;$('analyze').disabled=false;$('preview').disabled=$('before').disabled=$('export').disabled=true;$('status').textContent='読み込みました。②を押してください。'};
async function seek(t){v.pause();const target=Math.max(.05,Math.min(v.duration-.15,t));if(v.ended){v.currentTime=0;await sleep(80)}return new Promise((resolve,reject)=>{let timer=setTimeout(()=>{cleanup();reject(Error('フレーム移動がタイムアウトしました'))},12000);function cleanup(){clearTimeout(timer);v.removeEventListener('seeked',ok);v.removeEventListener('error',bad)}function ok(){cleanup();resolve()}function bad(){cleanup();reject(Error('動画を読み込めません'))}v.addEventListener('seeked',ok);v.addEventListener('error',bad);try{v.currentTime=target;if(!v.seeking&&Math.abs(v.currentTime-target)<.03&&v.readyState>=2){cleanup();resolve()}}catch(e){cleanup();reject(e)}})}
async function decodedFrame(){if(v.readyState<2)await new Promise((res,rej)=>{let timer=setTimeout(()=>{cleanup();rej(Error('デコード待機タイムアウト'))},8000);function cleanup(){clearTimeout(timer);v.removeEventListener('loadeddata',ok);v.removeEventListener('canplay',ok)}function ok(){cleanup();res()}v.addEventListener('loadeddata',ok);v.addEventListener('canplay',ok)});await sleep(130)}
function capture(){ctx.drawImage(v,0,0,W,H);return new Uint8ClampedArray(ctx.getImageData(0,0,W,H).data)}
function frameIsBlack(data){let count=0,bright=0,step=Math.max(4,Math.floor(data.length/8000)*4);for(let i=0;i<data.length;i+=step){count++;if(data[i]+data[i+1]+data[i+2]>36)bright++}return bright<count*.012}
async function captureReady(t){for(let attempt=0;attempt<4;attempt++){if(t!==undefined)await seek(Math.min(v.duration-.2,Math.max(.1,t+(attempt?attempt*.19:0))));await decodedFrame();let data=capture();if(!frameIsBlack(data))return data;await sleep(200)}throw Error('この時刻は黒い映像でした')}
function show(data){ctx.putImageData(new ImageData(new Uint8ClampedArray(data),W,H),0,0)}
$('analyze').onclick=async()=>{if(busy)return;busy=true;$('analyze').disabled=true;try{await new Promise(r=>v.readyState>=1?r():v.addEventListener('loadedmetadata',r,{once:true}));if(!isFinite(v.duration)||v.duration<=0||v.duration>65)throw Error('1分以内の動画を選んでください');let scale=Math.min(1,360/v.videoWidth);W=Math.max(2,Math.round(v.videoWidth*scale/2)*2);H=Math.max(2,Math.round(v.videoHeight*scale/2)*2);c.width=mc.width=W;c.height=mc.height=H;mask=new Uint8Array(W*H);frames=[];let count=15;let rejected=0;for(let i=0;i<count;i++){let t=Math.min(v.duration-.02,Math.max(.01,v.duration*(i+.5)/count));try{let data=await captureReady(t);frames.push({t,data});}catch(e){rejected++;}$('status').textContent='フレーム取得中 '+(i+1)+'/'+count;await sleep(0)}if(frames.length<3)throw Error('有効な映像を3枚以上取得できませんでした。動画を選び直してください');ready=true;show(frames[Math.floor(frames.length/2)].data);drawMask();$('maskMode').checked=false;mc.classList.add('off');$('preview').disabled=$('before').disabled=false;$('export').disabled=!(window.MediaRecorder&&c.captureStream);$('status').textContent='準備完了：'+W+'×'+H+' / '+frames.length+'フレーム。映像を確認後、「指で塗るモード」をONにして塗ってください。除外:'+rejected+'枚。'}catch(e){$('status').textContent='エラー：'+e.message}finally{busy=false;$('analyze').disabled=false}};
$('brush').oninput=()=>{$('bv').textContent=$('brush').value};$('strength').oninput=()=>{$('sv').textContent=$('strength').value};$('motion').oninput=()=>{$('mv').textContent=$('motion').value};$('maskMode').onchange=()=>mc.classList.toggle('off',!$('maskMode').checked);$('clearMask').onclick=()=>{if(mask)mask.fill(0);drawMask()};
function drawMask(){if(!mask)return;let a=mctx.createImageData(W,H);for(let i=0;i<mask.length;i++){let j=i*4;a.data[j]=255;a.data[j+1]=45;a.data[j+2]=50;a.data[j+3]=Math.round(mask[i]*.55)}mctx.putImageData(a,0,0)}
function paint(x,y){if(!mask)return;let rad=Math.max(2,Math.round(Math.min(W,H)*Number($('brush').value)/200));for(let yy=Math.max(0,Math.floor(y-rad));yy<Math.min(H,Math.ceil(y+rad));yy++)for(let xx=Math.max(0,Math.floor(x-rad));xx<Math.min(W,Math.ceil(x+rad));xx++){let d=Math.hypot(xx-x,yy-y);if(d<rad)mask[yy*W+xx]=Math.max(mask[yy*W+xx],Math.round(255*Math.min(1,(rad-d)/Math.max(2,rad*.2))))}}
function point(e){let r=mc.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
mc.addEventListener('pointerdown',e=>{if(!ready||!$('maskMode').checked)return;painting=true;mc.setPointerCapture(e.pointerId);last=point(e);paint(last.x,last.y);drawMask();e.preventDefault()});mc.addEventListener('pointermove',e=>{if(!painting)return;let p=point(e),n=Math.max(1,Math.ceil(Math.hypot(p.x-last.x,p.y-last.y)/4));for(let i=1;i<=n;i++)paint(last.x+(p.x-last.x)*i/n,last.y+(p.y-last.y)*i/n);last=p;drawMask();e.preventDefault()});mc.addEventListener('pointerup',()=>painting=false);mc.addEventListener('pointercancel',()=>painting=false);
function gray(data){let g=new Uint8Array(W*H);for(let i=0;i<g.length;i++)g[i]=(data[i*4]*77+data[i*4+1]*150+data[i*4+2]*29)>>8;return g}
function motion(ref,other,maxMove){let a=gray(ref),b=gray(other),step=6,coarse=4,best={dx:0,dy:0,err:Infinity};function score(dx,dy){let sum=0,n=0;for(let y=maxMove+2;y<H-maxMove-2;y+=step)for(let x=maxMove+2;x<W-maxMove-2;x+=step){let p=y*W+x,q=(y+dy)*W+x+dx;if(mask[p]>20||mask[q]>20)continue;sum+=Math.abs(a[p]-b[q]);n++}return n>30?sum/n:Infinity}for(let dy=-maxMove;dy<=maxMove;dy+=coarse)for(let dx=-maxMove;dx<=maxMove;dx+=coarse){let err=score(dx,dy);if(err<best.err)best={dx,dy,err}}let old=best;for(let dy=Math.max(-maxMove,old.dy-5);dy<=Math.min(maxMove,old.dy+5);dy++)for(let dx=Math.max(-maxMove,old.dx-5);dx<=Math.min(maxMove,old.dx+5);dx++){let err=score(dx,dy);if(err<best.err)best={dx,dy,err}}return best}
function correct(data,frameIndex){let out=new Uint8ClampedArray(data),acc=new Float32Array(W*H*3),weights=new Float32Array(W*H),maxMove=Number($('motion').value),used=0;for(let k=0;k<frames.length;k++){if(k===frameIndex)continue;let f=frames[k],m=motion(data,f.data,maxMove);if(!isFinite(m.err)||m.err>38)continue;used++;let dx=m.dx,dy=m.dy;for(let y=0;y<H;y++)for(let x=0;x<W;x++){let p=y*W+x;if(mask[p]<10)continue;let xx=x+dx,yy=y+dy;if(xx<0||xx>=W||yy<0||yy>=H)continue;let q=yy*W+xx;if(mask[q]>10)continue;let weight=1/(2+m.err);for(let z=0;z<3;z++)acc[p*3+z]+=f.data[q*4+z]*weight;weights[p]+=weight}}let covered=0,total=0,s=Number($('strength').value)/100;for(let p=0;p<mask.length;p++){if(mask[p]<10)continue;total++;if(!weights[p])continue;covered++;let blend=s*mask[p]/255;for(let z=0;z<3;z++)out[p*4+z]=data[p*4+z]*(1-blend)+(acc[p*3+z]/weights[p])*blend}return{data:out,coverage:total?Math.round(covered/total*100):0,used}}
$('before').onclick=()=>{if(ready)show(frames[Math.floor(frames.length/2)].data)};
$('preview').onclick=async()=>{if(!ready||busy)return;busy=true;$('preview').disabled=true;$('result').textContent='動き解析中…';await sleep(30);try{let r=correct(frames[7].data,7);show(r.data);$('result').textContent='復元できた指定領域：約'+r.coverage+'% / 使えた参照フレーム：'+r.used+'枚。残りは元の画像のままです。カメラの移動が少ないと復元できません。'}catch(e){$('result').textContent='エラー：'+e.message}finally{busy=false;$('preview').disabled=false}};
$('export').onclick=async()=>{if(!ready||busy)return;busy=true;$('export').disabled=true;let status=$('exportStatus');try{let mime=['video/mp4','video/webm;codecs=vp9','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));if(!mime)throw Error('このSafariは動画録画に非対応です');let stream=c.captureStream(12),rec=new MediaRecorder(stream,{mimeType:mime}),chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};let done=new Promise((resolve,reject)=>{rec.onstop=resolve;rec.onerror=()=>reject(Error('録画失敗'))});await seek(.2);v.pause();rec.start();await v.play();let start=performance.now(),lastTime=-1,blackSkipped=0;while(!v.ended&&v.currentTime<v.duration-.03){let t=v.currentTime;if(t!==lastTime){let data;try{data=await captureReady()}catch(e){blackSkipped++;await sleep(100);if(blackSkipped>25)throw Error('映像が取得できません。iPhoneで動画を再生できるか確認してください');continue}blackSkipped=0;let nearest=0;for(let i=1;i<frames.length;i++)if(Math.abs(frames[i].t-t)<Math.abs(frames[nearest].t-t))nearest=i;let r=correct(data,nearest);show(r.data);lastTime=t;status.textContent='書き出し中 '+Math.round(t/v.duration*100)+'%'}await sleep(35);if(performance.now()-start>(v.duration*10+30)*1000)break}v.pause();rec.stop();await done;let blob=new Blob(chunks,{type:mime}),outURL=URL.createObjectURL(blob),ext=mime.includes('mp4')?'mp4':'webm';$('output').src=outURL;$('output').style.display='block';$('download').href=outURL;$('download').download='corrected-v6.'+ext;$('download').style.display='inline';$('download').textContent='補正動画を保存 ('+ext+')';status.textContent='書き出し完了（音声なし）。'}catch(e){status.textContent='書き出しエラー：'+e.message}finally{busy=false;$('export').disabled=false}};
</script></body></html>
